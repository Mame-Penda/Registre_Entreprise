<!-- templates/bodacc.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Annonces et publications</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #F1F5F9; margin: 0; padding: 24px; color: #1E293B; }
    .result-card { background: white; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.06); padding: 24px; max-width: 1200px; margin: 0 auto; }
    h2 { color: #2a6f97; margin-bottom: 20px; text-align:center }
    table { width:100%; border-collapse:collapse; font-size:0.95rem }
    th, td { padding:12px 10px; border-bottom:1px solid #e6eef6; text-align:left; vertical-align:top }
    th { background: #eaf8ff; color:#2a6f97 }
    .pdf-button { display:inline-block; background:#2a6f97; color:#fff; padding:8px 12px; border-radius:8px; text-decoration:none; font-weight:600 }
    .pdf-button:hover { background:#1b4f6a }
    .empty { text-align:center; padding:40px; color:#64748B }
  </style>
</head>
<body>
  <div class="result-card">
    <h2>Annonces BODACC</h2>
    <table>
      <thead>
        <tr><th>Date</th><th>Type</th><th>Tribunal</th><th>Référence</th><th>Description</th><th>PDF</th></tr>
      </thead>
      <tbody id="bodacc-table-body">
        <tr><td colspan="6" style="text-align:center">Chargement...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    async function loadBodacc(siret) {
      const tbody = document.getElementById('bodacc-table-body');
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center">Chargement...</td></tr>';
      try {
        const res = await fetch(`/bodacc?siret=${encodeURIComponent(siret)}`);
        const j = await res.json();
        if (!j.results || j.results.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center">Aucune annonce trouvée.</td></tr>';
          return;
        }
        tbody.innerHTML = '';
        j.results.forEach(item => {
          const tr = document.createElement('tr');
          const cell = (t) => {
            const td = document.createElement('td');
            td.textContent = t || '';
            return td;
          };
          tr.appendChild(cell(item.date_parution));
          tr.appendChild(cell(item.type_avis));
          tr.appendChild(cell(item.tribunal));
          tr.appendChild(cell(item.reference));
          tr.appendChild(cell(item.description));

          const tdPdf = document.createElement('td');
          if (item.pdf_url) {
            const a = document.createElement('a');
            // ouvre la page interne qui embed le PDF en iframe
            a.href = `/bodacc/view_pdf?url=${encodeURIComponent(item.pdf_url)}`;
            a.target = '_blank';
            a.className = 'pdf-button';
            a.innerHTML = '<i class="fas fa-file-pdf"></i> Voir PDF';
            tdPdf.appendChild(a);
          } else {
            tdPdf.textContent = 'N/A';
          }
          tr.appendChild(tdPdf);
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:red">Erreur de chargement</td></tr>';
        console.error(err);
      }
    }

    // init : récupère le siret de l'URL (ex: ?siret=...)
    (function(){
      const params = new URLSearchParams(window.location.search);
      const siret = params.get('siret') || params.get('siren');
      if (!siret) {
        document.getElementById('bodacc-table-body').innerHTML = '<tr><td colspan="6" style="text-align:center;color:red">Aucun SIRET fourni</td></tr>';
        return;
      }
      loadBodacc(siret);
    })();
  </script>
</body>
</html>
